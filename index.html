<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#172033">
<title>IST Timetable</title>
<meta name="description" content="Timetable app for the Institute of Space and Technology (IST), Islamabad. Class schedules for every section, plus free rooms and labs, updated live and available offline.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <h1>IST Timetable</h1>
  <button id="refresh" class="icon-btn" aria-label="Check for timetable updates">↻</button>
</header>
<p id="status" class="status" role="status"></p>

<nav class="tabs" role="tablist">
  <button role="tab" data-view="classes" aria-selected="true">My classes</button>
  <button role="tab" data-view="free" aria-selected="false">Free rooms</button>
</nav>

<main>
  <section id="view-classes">
    <label class="field">Section
      <select id="section"></select>
    </label>
    <div class="days" id="days-classes"></div>
    <div id="timeline"></div>
  </section>

  <section id="view-free" hidden>
    <div class="seg">
      <button data-mode="now" aria-pressed="true">Right now</button>
      <button data-mode="slots" aria-pressed="false">By time</button>
    </div>
    <div class="days" id="days-free" hidden></div>
    <div class="seg small">
      <button data-kind="rooms" aria-pressed="true">Rooms</button>
      <button data-kind="labs" aria-pressed="false">Labs</button>
    </div>
    <div id="free-list"></div>
  </section>
</main>
<footer class="credit">
  <p>Made by <strong>Abdullah Bilal</strong></p>
</footer>
<script src="app.js"></script>
</body>
</html>
